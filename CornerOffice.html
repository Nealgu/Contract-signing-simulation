:root {
  color-scheme: light;

  --line: #e3dfd0;

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; }
button:focus-visible, [tabindex]:focus-visible { outline: 3px solid #41806a; outline-offset: 3px; }
[hidden] { display: none !important; }
h1, h2, h3, p { margin: 0; }
svg { display: block; }
[data-icon] { display: inline-grid; place-items: center; flex: none; }

.sprite { width: 100%; height: 100%; overflow: visible; }
.topbar { background: #fffdf5; border-bottom: 1px solid var(--line); }
.topbar-inner, .page { max-width: 1430px; margin: auto; padding-inline: clamp(24px, 4.3vw, 64px); }

.brand-sub, .clock-year { font: 800 9px/1.4 system-ui, sans-serif; letter-spacing: .18em; color: var(--muted); }
.save-status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin-right: 6px; }
i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #64a078; }
.icon-button { display: inline-grid; place-items: center; width: 36px; height: 36px; border: 1px solid var(--line); border-radius: 11px; background: var(--paper); font-size: 17px; }
.icon-button:hover { background: #eeeee2; }
.intro { display: flex; align-items: end; justify-content: space-between; gap: 14px; padding-block: 27px 21px; }
.eyebrow { display: flex; align-items: center; gap: 8px; color: #517360; font-size: 11px; font-weight: 800; letter-spacing: .16em; }
.eyebrow span { display: inline-block; width: 16px; height: 3px; background: #dda942; border-radius: 2px; }
h1 { margin-top: 3px; font-size: clamp(33px, 3.1vw, 48px); line-height: 1.22; letter-spacing: -.055em; font-weight: 900; }
h1 span { color: #c89028; }
.intro p { color: var(--muted); font-size: 13px; margin-top: 6px; }
.year-tag { display: flex; align-items: center; gap: 8px; padding: 7px 12px; border: 1px solid #e3dec9; background: #fbf7e8; border-radius: 99px; color: #655a39; white-space: nowrap; font-size: 12px; font-weight: 700; }
.year-tag b { color: #c19543; }
.board { display: grid; grid-template-columns: minmax(0, 1fr) minmax(245px, 285px); gap: 20px; align-items: start; padding-bottom: 32px; }
.primary, .sidebar { min-width: 0; display: grid; gap: 17px; }
.panel { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); }
.scene-panel { overflow: hidden; }
.panel-head, .stats-title { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.panel-head { padding: 11px 15px; }
h2 { font-size: 17px; font-weight: 900; }
.panel-head h2 { display: flex; align-items: center; gap: 8px; }
.heading-icon { color: var(--green); background: #e9f0e3; border-radius: 7px; width: 28px; height: 28px; }
.status-chip { display: flex; align-items: center; gap: 6px; border-radius: 99px; background: #eaf0e1; color: #41614a; padding: 4px 10px; font-size: 11px; font-weight: 700; }
.status-chip[data-phase="opportunities"], .status-chip[data-phase="summary"] { background: #f7edcf; color: #74552f; }
.status-chip[data-phase="opportunities"] i, .status-chip[data-phase="summary"] i { background: #c39236; }
.street { position: relative; isolation: isolate; aspect-ratio: 1080 / 600; background: #dbeae1; overflow: hidden; }
.street-art { display: block; width: 100%; height: 100%; }
.walkers { position: absolute; inset: 0; pointer-events: none; }
.walker { position: absolute; width: clamp(36px, 7.3%, 73px); aspect-ratio: .72; transform: translate(-50%, -100%); }
.walker-button { pointer-events: auto; background: transparent; border: 0; padding: 0; overflow: visible; border-radius: 12px; }
.walker-body { display: block; height: 100%; position: relative; z-index: 1; filter: drop-shadow(0 1px 0 #f9e9bb); }
.walker::after { position: absolute; content: ""; left: 21%; right: 19%; bottom: 1%; height: 8%; border-radius: 50%; background: #3f52412e; }
.walker-button .walker-body { animation: stroll 550ms ease-in-out infinite alternate; }
@keyframes stroll { to { transform: translateY(-4%); } }
.walker-button:hover .walker-body, .walker-button:focus-visible .walker-body { filter: drop-shadow(0 0 3px #fff9cf) drop-shadow(0 0 4px #fff9cf); }
.walker-tag { display: flex; align-items: center; justify-content: center; gap: 4px; position: absolute; z-index: 2; left: 50%; bottom: 100%; transform: translateX(-50%); background: #fff9dc; color: #4e4c32; border: 1px solid #d3a652; border-radius: 8px; white-space: nowrap; padding: 2px 6px; font-weight: 900; font-size: clamp(9px, .85vw, 12px); box-shadow: 0 2px 0 #4e4b3824; }
.walker-tag::after { content: ""; position: absolute; width: 5px; height: 5px; bottom: -4px; left: calc(50% - 3px); transform: rotate(45deg); background: #fff9dc; border-right: 1px solid #d3a652; border-bottom: 1px solid #d3a652; }
.walker-button[data-kind="support"] .walker-tag { color: #2f584e; background: #e4f4e8; border-color: #83a995; }
.walker-button[data-kind="support"] .walker-tag::after { background: #e4f4e8; border-color: #83a995; }
.player .walker-tag { background: #285843; border-color: #285843; color: #fff6d5; }
.player .walker-tag::after { background: #285843; border-color: #285843; }
.street-footer { padding: 9px 15px; color: var(--muted); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 12px; font-size: 11px; }
.street-footer > span { display: flex; align-items: center; gap: 6px; }
.street-footer strong { color: var(--green); }
.event-panel .heading-icon { color: #805e29; background: #f7e9c5; }
.event-badge { border-radius: 99px; background: #f3ebd7; color: #735828; padding: 3px 9px; font-size: 11px; font-weight: 800; font-variant-numeric: tabular-nums; }
.event-badge[data-active="true"] { background: #f7d486; color: #654921; }
.event-body { margin: 0 14px 13px; padding: 10px 12px; border: 1px solid #e8e0ca; border-radius: 10px; background: #fbf8ed; }
.event-body h3 { font-size: 14px; }
.event-body p { font-size: 12px; color: var(--muted); }
.event-body h3 + p { margin-top: 3px; }
.event-choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 155px), 1fr)); gap: 7px; margin-top: 8px; }
.event-choice { padding: 7px 8px; background: var(--paper); border: 1px solid #e3d4aa; border-radius: 8px; text-align: left; font-size: 12px; }
.event-choice:hover:not(:disabled) { background: #f9edcd; border-color: #c29c53; }
.event-choice:disabled { background: #efede4; color: #716d62; }
.event-choice strong, .event-choice small { display: block; }
.event-choice small, .event-effects { color: #52664e; font-size: 11px; }
.event-effects { margin-top: 4px; }
.clock-panel, .stats-panel { padding: 15px; }
.clock-top { display: flex; justify-content: space-between; align-items: center; }
.clock-top > span:first-child { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 800; }
.clock-year { color: #7e755c; }
.week-line { margin-top: 8px; color: var(--muted); font-size: 12px; }
.week-line strong { color: var(--ink); font-size: 25px; font-weight: 900; }
.clock-box { margin-top: 9px; background: #f2eddb; border: 1px solid #e9e1c7; border-radius: 11px; padding: 10px 11px; }
.clock-caption { display: flex; align-items: center; gap: 6px; color: #695b3e; font-size: 11px; font-weight: 700; }
#timer { font: 850 29px/1.23 system-ui, sans-serif; font-variant-numeric: tabular-nums; letter-spacing: .045em; }
.clock-box[data-low="true"] #timer { color: #a34732; }
.timer-track, .stat-track { overflow: hidden; background: #e5deca; border-radius: 99px; height: 6px; margin-top: 6px; }
.timer-track span, .stat-track span { display: block; height: 100%; border-radius: inherit; }
.timer-track span { background: #cfa13f; width: 100%; }
.week-action { margin-top: 11px; width: 100%; }
.cash-panel { padding: 13px 15px; background: #eef3e5; border-color: #dce5d3; }
.cash-main { display: flex; align-items: center; gap: 11px; }
.cash-icon { width: 39px; height: 39px; border-radius: 11px; background: #dbe9d3; color: #345d49; font-size: 21px; }
#cash-label { font-size: 11px; color: #4d684f; font-weight: 700; }
.cash-value { font: 850 26px/1.15 system-ui, sans-serif; font-variant-numeric: tabular-nums; }
.cash-value[data-negative="true"], .shop-balance[data-negative="true"] { color: #8a3a2c; }
.cash-meter { margin-top: 10px; padding-top: 8px; border-top: 1px solid #d9e4d1; color: #4d684f; }
.cash-meter div { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 3px 6px; font-size: 11px; }
.cash-meter strong { font: 800 14px system-ui, sans-serif; color: #345d49; }
.cash-meter small { font-size: 10px; }
.stats-title span { font-size: 10px; color: var(--muted); }
.role-summary { margin-block: 10px 13px; padding: 5px 9px; display: flex; align-items: center; gap: 8px; min-height: 43px; background: #f1eee2; border-radius: 9px; font-size: 11px; color: var(--muted); }
.mini-avatar { width: 27px; height: 34px; flex: none; }
.role-summary b { display: block; font-size: 12px; color: var(--ink); }
.stat + .stat { margin-top: 10px; }
.stat-title { display: flex; align-items: center; gap: 5px; color: #4c584a; font-size: 11px; font-weight: 700; }
.stat-title strong { margin-left: auto; font: 800 12px system-ui, sans-serif; color: var(--ink); }
.stat-track { height: 5px; background: #ebe8dc; margin-top: 4px; }
.stat-track span { background: var(--stat-color); }
.empty-records { padding: 15px; border: 1px dashed #d9d5c6; border-radius: 10px; color: var(--muted); text-align: center; font-size: 12px; }
dialog { width: min(92vw, 710px); max-height: calc(100dvh - 36px); padding: 0; color: var(--ink); border: 1px solid #d9d3be; border-radius: 20px; background: var(--paper); box-shadow: 0 12px 0 #263c3929, 0 25px 100px #16231b44; }
dialog::backdrop { background: #24362b80; backdrop-filter: blur(2px); }
dialog[data-view="contract"], dialog[data-view="help"], dialog[data-view="reset"] { width: min(92vw, 490px); }
dialog[data-view="roles"] { width: min(94vw, 748px); }
.dialog-inner { padding: clamp(19px, 3vw, 30px); }
.dialog-head { position: relative; padding-right: 38px; margin-bottom: 16px; }
.dialog-head .icon-button { position: absolute; right: 0; top: 0; }
.dialog-kicker { display: block; color: #517360; font-size: 11px; font-weight: 900; letter-spacing: .15em; margin-bottom: 4px; }
.dialog-head h2 { font-size: clamp(22px, 3vw, 32px); line-height: 1.28; letter-spacing: -.025em; }
.dialog-head p { color: var(--muted); margin-top: 6px; font-size: 13px; }
.dialog-actions { display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 10px; margin-top: 19px; }
.dialog-actions .push { margin-right: auto; color: var(--muted); font-size: 12px; }
.button { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 39px; border: 1px solid #d8d1bd; background: #f9f5e9; border-radius: 9px; padding: 7px 14px; font-size: 13px; font-weight: 800; }
.button:hover { filter: brightness(.97); }
.button:active { transform: translateY(1px); }
.button.accent { background: var(--yellow); border-color: #d4a74e; box-shadow: 0 2px 0 #bc8f3c; color: #463713; }
.button:disabled { background: #eeeade; border-color: #e3dece; box-shadow: none; color: #706f62; filter: none; transform: none; }
.role-grid, .shop-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 11px; }
.role-card { min-width: 0; display: flex; flex-direction: column; text-align: left; border: 1px solid var(--line); background: #fcf8ea; border-radius: 13px; padding: 8px 10px 11px; }
.role-card[aria-pressed="true"] { border-color: #548468; box-shadow: inset 0 0 0 1px #548468; background: #f1f5e9; }
.role-art { height: 108px; width: 100%; border-radius: 9px; display: grid; place-items: center; background: radial-gradient(circle, #fff5d8 0 36%, transparent 37%), var(--role-color); margin-bottom: 7px; }
.role-art .sprite { width: 73px; height: 101px; filter: drop-shadow(0 2px 0 #533a2f38); }
.role-name { font-size: 15px; font-weight: 900; }
.role-title { color: var(--green); font-size: 11px; font-weight: 800; }
.role-desc { font-size: 11px; color: var(--muted); margin: 4px 0 6px; }
.role-bonus { display: block; color: #4f583b; font-size: 10px; font-weight: 800; margin-top: auto; }
.document { position: relative; border: 1px solid #e5dabd; border-radius: 12px; background: #fbf6e6; padding: 14px; }
.document h3 { font-size: 13px; margin-bottom: 4px; }
.document p { color: var(--muted); font-size: 13px; }
.document-deliverable { margin-top: 10px; padding-top: 9px; border-top: 1px solid #e5dabd; }
.contract-figures, .summary-figures { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.figure { padding: 9px 11px; background: #f0f2e5; border-radius: 9px; }
.figure small { display: block; color: #536650; font-size: 11px; }
.figure strong { font: 850 22px/1.3 system-ui, sans-serif; color: #345d49; }
.figure[data-risk="high"] strong { color: #a44f3d; }
.figure[data-risk="medium"] strong { color: #8a6026; }
.contract-note { color: var(--muted); font-size: 12px; margin-top: 9px; }
.contract-note strong { color: var(--ink); }
.result { margin-top: 10px; padding: 9px 11px; border-radius: 8px; color: #345d49; background: #e9f2e1; font-size: 13px; font-weight: 800; }
.result[data-status="lost"] { color: #7e4535; background: #f5e8de; }
.result[data-status="expired"] { color: #6c5735; background: #f4ecd6; }
.shop-toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin: -4px 0 10px; }
.monthly-settlement { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-bottom: 14px; padding: 8px 11px; border-radius: 9px; background: #f2eddb; color: #695b3e; font-size: 12px; }
.shop-balance { color: var(--green); font-size: 13px; font-weight: 800; }
.shop-balance small { display: block; color: var(--muted); font-size: 11px; font-weight: 400; }
.shop-toolbar .button { min-height: 34px; }
.shop-card { padding: 11px; background: #fbf7ea; border: 1px solid #e7dec8; border-radius: 12px; display: flex; flex-direction: column; gap: 6px; }
.shop-icon { width: 34px; height: 34px; border-radius: 9px; color: #665024; background: #f3e2af; font-size: 20px; }
.shop-card h3 { font-size: 14px; }
.shop-card p { font-size: 12px; color: var(--muted); }
.shop-card .button { margin-top: auto; padding-inline: 5px; }
.boosts { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 4px; }
.boosts span { border-radius: 5px; background: #e6eedc; padding: 2px 5px; font-size: 10px; color: #3e624b; font-weight: 800; }
.summary-figures { grid-template-columns: repeat(3, 1fr); margin-bottom: 13px; }
.summary-stats { display: flex; gap: 6px; flex-wrap: wrap; }
.history-list { list-style: none; padding: 0; margin: 0; max-height: 42vh; overflow: auto; }
.history-list li { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 4px; border-bottom: 1px solid var(--line); font-size: 13px; }
.history-list li > strong { max-width: 55%; text-align: right; }
.history-list small { color: var(--muted); }
.help-list { margin: 0; padding-left: 20px; color: #46564b; font-size: 13px; }
.help-list li + li { margin-top: 8px; }
.toast { position: fixed; z-index: 4; right: 24px; bottom: 22px; color: #fffbed; background: #315641; border-radius: 10px; padding: 10px 14px; box-shadow: 0 4px 16px #263c3933; font-size: 13px; font-weight: 800; }
@media (max-width: 870px) {
  .board { gap: 12px; grid-template-columns: minmax(0, 1fr) minmax(194px, 224px); }
  .topbar-inner, .page { padding-inline: 19px; }
  .clock-panel, .stats-panel { padding: 12px; }
}
@media (max-width: 630px) {
  .top-actions { gap: 5px; }
  .top-actions .icon-button { width: 30px; height: 30px; }
  .brand-sub { letter-spacing: .08em; }
  .board { grid-template-columns: 1fr; }
  .sidebar { grid-template-columns: 1fr 1fr; }
  .cash-panel { align-self: start; }
  .stats-panel { grid-column: 1 / -1; }
  .year-tag, .save-status { display: none; }
  .role-grid, .shop-grid { grid-template-columns: 1fr; }
  .role-art { height: 75px; }
  .role-art .sprite { width: 49px; height: 68px; }
  .summary-figures { grid-template-columns: 1fr 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  .walker-button .walker-body { animation: none; }
}

</style>

      sum + (contract.kind === 'support' ? 0 : contract.amount), 0);
    const supportRevenue = payments.reduce((sum, payment) => sum + payment.amount, 0);
    const isMonthEnd = monthEndWeeks.includes(state.week);
    const payroll = isMonthEnd ? monthlyPayroll : 0;
    const operatingCost = isMonthEnd ? monthlyOperatingCost : 0;
    const events = (state.eventHistory || []).filter(event => event.week === state.week);
    const { eventRevenue, eventSpent } = eventTotals(events);
    const result = {
      week: state.week,
      revenue: projectRevenue + supportRevenue + eventRevenue,
      projectRevenue,
      supportRevenue,
      payroll,
      operatingCost,
      eventRevenue,
      eventSpent,
      signed,
      won: won.length,
      lost,
      expired: state.contracts.length - signed,
    };
    return {
      ...state,
      phase: 'opportunities',
      deadline: null,
      cash: state.cash + supportRevenue - payroll - operatingCost,
      supportContracts: contracts,
      supportPayments: [...state.supportPayments, ...payments],
      opportunities: makeOpportunities(state.week),
      weekResults: [...state.weekResults, result],
    };
  }

  function signContract(state, id, now = Date.now(), random = Math.random) {
    const current = tick(state, now);
    if (current.phase !== 'week') return current;
    const contract = current.contracts.find(item => item.id === id);
    if (!isContractAvailable(current, contract, now)) return current;

    const chance = calcChance(current, contract);
    const succeeded = random() * 100 < chance;
    const status = succeeded ? 'won' : 'lost';
    const result = { ...contract, status, chance };
    const kind = contract.kind || 'project';
    const record = {
      week: current.week, id, client: contract.client, title: contract.title,
      amount: contract.amount, status, chance, kind,
      ...(kind === 'support' ? { months: contract.months } : {}),
    };
    const supportContracts = succeeded && kind === 'support'
      ? [...current.supportContracts, {
        week: current.week,
        id,
        client: contract.client,
        title: contract.title,
        amount: contract.amount,
        remainingMonths: contract.months,
        nextPaymentWeek: firstSupportPaymentWeek(current.week),
      }] : current.supportContracts;
    return {
      ...current,
      cash: current.cash + (succeeded && kind === 'project' ? contract.amount : 0),
      supportContracts,
      contracts: current.contracts.map(item => item.id === id ? result : item),
      history: [...current.history, record],
    };
  }

  function buyOpportunity(state, id) {
    if (state.phase !== 'opportunities') return state;
    const card = state.opportunities.find(item => item.id === id);
    if (!card || card.purchased || card.cost > state.cash) return state;

    const stats = { ...state.stats };
    const boosts = {};
    for (const [key, points] of Object.entries(card.boosts)) {
      const applied = Math.min(points, 100 - stats[key]);
      if (applied > 0) {
        stats[key] += applied;
        boosts[key] = applied;
      }
    }
    if (Object.keys(boosts).length === 0) return state;
    const record = { week: state.week, id, title: card.title, cost: card.cost, boosts };
    return {
      ...state,
      cash: state.cash - card.cost,
      stats,
      opportunities: state.opportunities.map(item => item.id === id ? { ...card, purchased: true } : item),
      opportunityPurchases: [...state.opportunityPurchases, record],
    };
  }

  function nextWeek(state, now = Date.now()) {
    if (state.phase !== 'opportunities') return state;
    if (state.week === weeksPerYear) return { ...state, phase: 'summary' };
    return openWeek(state, state.week + 1, now);
  }

  function summarize(state) {
    const wins = state.history.filter(record => record.status === 'won');
    const projectRevenue = wins.reduce((sum, record) =>
      sum + (record.kind === 'support' ? 0 : record.amount), 0);
    const supportRevenue = state.supportPayments.reduce((sum, record) => sum + record.amount, 0);
    const opportunitySpent = state.opportunityPurchases.reduce((sum, record) => sum + record.cost, 0);
    const refreshSpent = state.opportunityRefreshes.reduce((sum, record) => sum + record.cost, 0);
    const payroll = state.weekResults.reduce((sum, record) => sum + (record.payroll ?? 0), 0);
    const operatingCost = state.weekResults.reduce((sum, record) => sum + (record.operatingCost ?? 0), 0);
    const { eventRevenue, eventSpent } = eventTotals(state.eventHistory);
    const revenue = projectRevenue + supportRevenue + eventRevenue;
    const spent = opportunitySpent + refreshSpent + eventSpent + payroll + operatingCost;
    return {
      revenue,
      spent,
      projectRevenue,
      supportRevenue,
      opportunitySpent,
      refreshSpent,
      payroll,
      operatingCost,
      eventRevenue,
      eventSpent,
      signed: state.history.length,
      won: wins.length,
      lost: state.history.length - wins.length,
      net: revenue - spent,
      finalCash: state.cash,
    };
  }

  const api = {
    roles, statLabels, startCash, weeksPerYear, weekSeconds,
    restoreGame, firstSupportPaymentWeek, getSupportSchedule,
    monthlyPayroll, monthlyOperatingCost, getMonthlyCostsSchedule,
    opportunityRefreshCost, getOpportunityRefreshCost, canRefreshOpportunities, refreshOpportunities,
    isContractAvailable, contractVisitProgress,
    createGame, calcChance, tick, signContract, buyOpportunity, nextWeek, summarize,
  };
  if (typeof module === 'object' && module.exports) module.exports = api;
  else globalThis.CornerGame = api;
})();

    },

  function eventFor(state) {
    if (state?.phase !== 'week' || !state.contracts.some(contract => Number.isFinite(contract.arrivesAt))) return null;
    const week = state.week;
    const template = templates[(week - 1) % templates.length];
    const start = state.deadline - state.weekDuration * 1000;
    const pace = state.weekDuration / 60;
    const opensAt = start + (13 + (week * 7 % 24)) * pace * 1000;
    const decisionSeconds = Math.max(9, (12 + (week % 5)) * pace);
    const expiresAt = Math.min(state.deadline, opensAt + decisionSeconds * 1000);
    return { id: `w${week}-event`, opensAt, expiresAt, ...template };
  }

  function boundedEffects(state, effects) {
    const stats = {};
    for (const [key, points] of Object.entries(effects.stats || {})) {
      const original = state.stats[key];
      const applied = Math.max(0, Math.min(100, original + points)) - original;
      if (applied !== 0) stats[key] = applied;
    }
    const cash = Math.max(state.cash > 0 ? -state.cash : 0, effects.cash || 0);
    return { cash, stats, chance: effects.chance || 0 };
  }

  function current(state, now = Date.now()) {
    const event = eventFor(state);
    if (!event || now < event.opensAt) return null;
    const resolved = (state.eventHistory || []).find(entry => entry.id === event.id);
    const choices = resolved || now >= event.expiresAt ? [] : (event.choices || []).map(choice => {
      const cash = choice.effects.cash || 0;
      const affordable = cash >= 0 || state.cash + cash >= 0;
      return { ...choice, affordable, effects: affordable ? boundedEffects(state, choice.effects) : choice.effects };
    });
    const { id, title, description, opensAt, expiresAt } = event;
    return { id, title, description, opensAt, expiresAt, choices, resolved };
  }

  function resolve(state, event, choice) {
    const { cash, stats, chance } = boundedEffects(state, choice.effects);
    const record = {
      week: state.week, id: event.id, title: event.title,
      label: choice.label, description: choice.description, cash, stats, chance,
    };
    const nextStats = { ...state.stats };
    for (const [key, points] of Object.entries(stats)) nextStats[key] += points;
    return {
      ...state,
      cash: state.cash + cash,
      stats: nextStats,
      eventChanceWeek: state.week,
      eventChanceBonus: chance,
      eventHistory: [...(state.eventHistory || []), record],
    };
  }

  function tick(state, now = Date.now()) {
    const event = eventFor(state);
    if (!event || now < event.opensAt || state.eventHistory?.some(entry => entry.id === event.id)) return state;
    if (event.automatic) return resolve(state, event, event.automatic);
    if (now >= event.expiresAt) return resolve(state, event, event.fallback);
    return state;
  }

  function choose(state, eventId, choiceId, now = Date.now()) {
    const next = tick(state, now);
    const event = current(next, now);
    if (!event || event.id !== eventId) return next;
    const choice = event.choices.find(item => item.id === choiceId);
    return choice?.affordable ? resolve(next, event, choice) : next;
  }

  const api = { current, tick, choose };
  if (typeof module === 'object' && module.exports) module.exports = api;
  else globalThis.CornerEvents = api;
})();

    const duration = state?.weekDuration ?? game.weekSeconds;
    const seconds = state?.phase === "week"
      ? Math.min(duration, Math.max(0, Math.ceil((state.deadline - now) / 1000)))
      : state ? 0 : duration;
    const label = `${weekNumber(Math.floor(seconds / 60))}:${weekNumber(seconds % 60)}`;
    if ($("timer").textContent !== label) $("timer").textContent = label;
    $("timer-fill").style.width = `${100 * seconds / duration}%`;
    $("timer").parentElement.dataset.low = seconds > 0 && seconds <= 10;
    const contractTimer = $("contract-timer");
    if (contractTimer && dialog.dataset.contractId) {
      const contract = state.contracts.find((item) => item.id === dialog.dataset.contractId);
      const visitLabel = contract ? `${Math.ceil(remainingVisitMs(contract, now) / 1000)} 秒` : "";
      if (contractTimer.textContent !== visitLabel) contractTimer.textContent = visitLabel;
    }
  }

  function moveWalker(walker, now) {
    const { element, route, contract } = walker;
    const progress = game.contractVisitProgress(state, contract, now);
    const left = prefersStill.matches || progress === null
      ? route.still : route.start + (route.end - route.start) * progress;
    element.style.left = `${left}%`;
  }

  function renderTraffic(now) {
    const phase = state?.phase || "start";
    const active = new Set();
    let onTheWay = false;
    let missed = 0;
    if (phase === "week") {
      state.contracts.forEach((contract, index) => {
        if (contract.status !== "open") return;
        if (!game.isContractAvailable(state, contract, now)) {
          if (remainingVisitMs(contract, now) === 0) missed++;
          else onTheWay = true;
          return;
        }
        active.add(contract.id);
        if (walkers.has(contract.id)) return;
        const route = routes[index % routes.length];
        const support = contract.kind === "support";
        const element = document.createElement("button");
        element.type = "button";
        element.className = "walker walker-button";
        element.dataset.action = "contract";
        element.dataset.id = contract.id;
        element.dataset.kind = support ? "support" : "project";
        element.setAttribute("aria-label", `查看${contract.client}的${support ? "月付支持" : "项目"}合同`);
        element.style.top = `${route.top}%`;
        element.style.zIndex = route.top;
        element.innerHTML = `<span class="walker-tag">${icon("doc")} ${support ? "月付" : "合同"}</span>
          <span class="walker-body">${sprite(`client-${(state.week - 1 + index) % 6}`)}</span>`;
        const walker = { element, route, contract };
        moveWalker(walker, now);
        walkers.set(contract.id, walker);
        $("traffic").append(element);
      });
    }
    for (const [id, walker] of walkers) {
      if (active.has(id)) continue;
      walker.element.remove();
      walkers.delete(id);
    }
    const liveLabel = active.size ? `街上 ${active.size} 位客户`
      : onTheWay ? "下一批客户正在路上" : "本周客户已走完";
    const caption = {
      start: "选好角色，即可开门营业",
      week: missed ? `${liveLabel} · 错过 ${missed} 位` : liveLabel,
      opportunities: "休息一下，看看周末机遇",
      summary: "创业第一年结束了"
    }[phase];
    if ($("street-caption").textContent !== caption) $("street-caption").textContent = caption;
  }

  function animateWalkers() {
    const now = Date.now();
    for (const walker of walkers.values()) moveWalker(walker, now);
    requestAnimationFrame(animateWalkers);
  }

  function renderBoard() {
    const phase = state?.phase || "start";
    const role = roleData();
    $("reset-button").hidden = !state;
    const status = $("district-status");
    status.dataset.phase = phase;
    status.innerHTML = `<i></i> ${{ start: "等待开业", week: "营业中", opportunities: "本周打烊", summary: "年度已完成" }[phase]}`;
    $("week-text").textContent = `第 ${weekNumber(state?.week || 1)} 周`;
    const cash = state?.cash ?? game.startCash;
    $("cash-label").textContent = cash < 0 ? "资金缺口" : "可用资金";
    $("cash-value").textContent = money(cash);
    $("cash-value").dataset.negative = cash < 0;
    const schedule = state && game.getSupportSchedule(state);
    const supportMeter = $("support-meter");
    supportMeter.hidden = !schedule?.activeCount;
    supportMeter.innerHTML = schedule?.activeCount ? `<div><span>支持合同月收入</span><strong>${money(schedule.monthlyIncome)}</strong></div>
      <small>${schedule.activeCount} 份在执行 · ${schedule.nextWeek ? `下次第 ${weekNumber(schedule.nextWeek)} 周末到账` : "余款跨年"} </small>` : "";
    const costsWeek = state && game.getMonthlyCostsSchedule(state);
    const costMeter = $("cost-meter");
    costMeter.hidden = !costsWeek;
    costMeter.innerHTML = costsWeek ? `<div><span>月度固定支出</span><strong>${money(game.monthlyPayroll + game.monthlyOperatingCost)}</strong></div>
      <small>第 ${weekNumber(costsWeek)} 周末扣款</small><br>
      <small>工资 ${money(game.monthlyPayroll)} · 运营费 ${money(game.monthlyOperatingCost)}</small>` : "";
    $("clock-caption").textContent = { start: "签约窗口", week: "签约倒计时", opportunities: "签约已截止", summary: "年度已结算" }[phase];
    const weekAction = $("week-action");
    weekAction.hidden = phase === "week" || phase === "start";
    weekAction.dataset.action = phase === "summary" ? "summary" : "shop";
    weekAction.innerHTML = phase === "summary" ? `查看年终总结 ${icon("arrow")}` : `进入机遇商店 ${icon("arrow")}`;

    $("role-summary").innerHTML = state
      ? `<div class="mini-avatar">${sprite(`player-${roleIndex(role.id)}`)}</div><div><b>${role.name}</b>${role.title}</div>`
      : `<div class="mini-avatar">${sprite(`player-${roleIndex(role.id)}`)}</div><div><b>创始人待定</b>选角后获得起始属性</div>`;
    $("stats").innerHTML = Object.entries(game.statLabels).map(([key, label]) => {
      const value = (state?.stats || role.stats)[key];
      const [glyph, color] = statVisuals[key];
      return `<div class="stat" style="--stat-color:${color}"><div class="stat-title">${icon(glyph)} ${label}<strong>${value}</strong></div>
        <div class="stat-track"><span style="width:${value}%"></span></div></div>`;
    }).join("");

    $("founder").innerHTML = state ? `<div class="walker player" style="left:50%;top:77.5%;z-index:78">
      <span class="walker-tag">你</span><span class="walker-body">${sprite(`player-${roleIndex(state.roleId)}`)}</span></div>` : "";
    const now = Date.now();
    renderTraffic(now);
    renderEvents(now);
    renderClock(now);
  }

  function button(label, action, options = {}) {
    return `<button class="button${options.accent ? " accent" : ""}" data-action="${action}"${options.id ? ` data-id="${options.id}"` : ""}${options.disabled ? " disabled" : ""}>${label}</button>`;
  }

  function show(view, kicker, title, description, body, actions, close = true) {
    dialog.dataset.view = view;
    delete dialog.dataset.contractId;
    delete dialog.dataset.awaiting;
    dialogContent.innerHTML = `<div class="dialog-inner"><header class="dialog-head">
      <span class="dialog-kicker">${kicker}</span><h2 id="dialog-title">${title}</h2>
      ${description ? `<p>${description}</p>` : ""}
      ${close ? `<button class="icon-button" data-action="close" aria-label="关闭">${icon("close")}</button>` : ""}
      </header>${body}${actions ? `<div class="dialog-actions">${actions}</div>` : ""}</div>`;
    if (!dialog.open) dialog.showModal();
    renderClock();
  }

  function showRoles(focusId) {
    const roleCards = game.roles.map((role, index) => `<button class="role-card" data-action="role" data-id="${role.id}" aria-pressed="${role.id === selectedRole}">
      <span class="role-art" style="--role-color:${role.color}">${sprite(`player-${index}`)}</span>
      <span class="role-name">${role.name}</span><span class="role-title">${role.title}</span>
      <span class="role-desc">${role.description}</span><span class="role-bonus">${role.bonus}</span></button>`).join("");
    show("roles", "开业筹备  /  NEW GAME", "谁来经营这家店？",
      "选择一位创始人。每位创始人带着不同的专长，陪公司走完第一年。",
      `<div class="role-grid">${roleCards}</div>`,
      `<span class="push">启动资金 <b>${money(game.startCash)}</b></span>${button(`开门营业 ${icon("arrow")}`, "start", { accent: true })}`, false);
    if (focusId) dialogContent.querySelector(`[data-id="${focusId}"]`)?.focus();
  }

  function figure(label, value, risk = "") {
    return `<div class="figure"${risk ? ` data-risk="${risk}"` : ""}><small>${label}</small><strong>${value}</strong></div>`;
  }

  function showContract(id, now = Date.now()) {
    const contract = state?.contracts.find((item) => item.id === id);
    if (!contract) return;
    const canSign = game.isContractAvailable(state, contract, now);
    const support = contract.kind === "support";
    const firstPaymentWeek = support ? game.firstSupportPaymentWeek(state.week) : null;
    const firstPaymentLabel = firstPaymentWeek > game.weeksPerYear
      ? "次年度起开始回款" : `第 ${weekNumber(firstPaymentWeek)} 周末首次到账`;
    const chance = canSign || contract.status !== "open"
      ? contract.chance ?? game.calcChance(state, contract) : null;
    const risk = chance === null ? "" : chance < 35 ? "high" : chance < 65 ? "medium" : "";
    const wonMessage = support
      ? `支持合同已生效，每月 ${money(contract.amount)}，${firstPaymentLabel}。`
      : `签约成功，${money(contract.amount)} 已到账。`;
    const outcome = contract.status === "won" ? wonMessage
      : contract.status === "lost" ? "签约失败，这份合同没有产生收入。"
      : canSign ? "" : "客户已经离开街区，这份合同已过期。";
    const deliverable = contract.deliverable
      ? `<div class="document-deliverable"><h3>${support ? "每月服务范围" : "交付与验收"}</h3><p>${contract.deliverable}</p></div>` : "";
    const body = `<div class="document"><h3>${support ? "月付支持需求" : "客户需求"}</h3><p>${contract.description}</p>${deliverable}</div>
      <div class="contract-figures">${figure(support ? "每月固定收入" : "签约即到账", money(contract.amount))}
      ${figure("签约成功率", chance === null ? "已截止" : `${chance}%`, risk)}</div>
      <p class="contract-note">主要考量 <strong>${game.statLabels[contract.focus]}</strong>
      ${support ? ` · 连续 ${contract.months} 个月 · ${firstPaymentLabel}` : ""}</p>
      ${outcome ? `<div class="result" data-status="${contract.status === "open" ? "expired" : contract.status}">${outcome}</div>` : ""}`;
    const actions = canSign
      ? `<span class="push">客户将在 <b id="contract-timer"></b>后离开</span>${button("暂不签约", "close")}${button("尝试签约", "sign", { id, accent: true })}`
      : button("知道了", "close", { accent: true });
    show("contract", `客户合同  /  ${contract.client}`, contract.title, "", body, actions);
    dialog.dataset.contractId = id;
    dialog.dataset.awaiting = String(canSign);
    renderClock(now);
  }

  function signedChange(value) {
    return `${value > 0 ? "+" : "−"}${Math.abs(value)}`;
  }

  function eventEffects(effects) {
    const descriptions = [];
    if (effects.cash) descriptions.push(`${effects.cash > 0 ? "+" : "−"}${money(Math.abs(effects.cash))}`);
    for (const [key, points] of Object.entries(effects.stats || {})) {
      if (points) descriptions.push(`${game.statLabels[key]} ${signedChange(points)}`);
    }
    if (effects.chance) descriptions.push(`当周签约率 ${signedChange(effects.chance)} 个百分点`);
    return descriptions.join(" · ");
  }

  function renderEvents(now) {
    const event = state && events.current(state, now);
    const resolved = event?.resolved || state?.eventHistory?.find((entry) => entry.week === state.week);
    const active = Boolean(event && !resolved);
    const badge = $("event-badge");
    const seconds = active ? Math.max(0, Math.ceil((event.expiresAt - now) / 1000)) : 0;
    const badgeText = active ? `剩余 ${seconds} 秒` : resolved ? "已处理" : "街区动态";
    if (badge.textContent !== badgeText) badge.textContent = badgeText;
    badge.dataset.active = active;
    const markup = resolved
      ? `<h3>${resolved.title}</h3><p>${resolved.description}</p><p class="event-effects"><b>${resolved.label}</b>
        ${eventEffects(resolved) || " · 无数值变动"}</p>`
      : active
        ? `<h3>${event.title}</h3><p>${event.description}</p>
          <div class="event-choices">${event.choices.map((choice) => `<button class="event-choice" type="button" data-action="event-choice"
            data-id="${event.id}" data-choice="${choice.id}"${choice.affordable ? "" : " disabled"}>
            <strong>${choice.label}</strong><small>${choice.description}</small>
            <small>${choice.affordable ? eventEffects(choice.effects) || "无数值变动" : "资金不足"}</small></button>`).join("")}</div>`
        : `<h3>街上暂时平静</h3><p>${state?.phase === "week" ? "留意这里。营业中可能发生需要立即处理的事。" : "营业中的街区消息会出现在这里。"}</p>`;
    if (markup !== eventMarkup) {
      $("event-body").innerHTML = markup;
      eventMarkup = markup;
    }
  }

  function boostsMarkup(boosts) {
    return Object.entries(boosts).map(([key, points]) => `<span>${game.statLabels[key]} +${points}</span>`).join("");
  }

  function showShop() {
    if (state?.phase !== "opportunities") return;
    const cards = state.opportunities.map((item) => {
      const unaffordable = state.cash < item.cost;
      const boosts = item.purchased
        ? state.opportunityPurchases.find((purchase) => purchase.id === item.id).boosts
        : Object.fromEntries(Object.entries(item.boosts)
          .map(([key, points]) => [key, Math.min(points, 100 - state.stats[key])])
          .filter(([, points]) => points > 0));
      const maxed = Object.keys(boosts).length === 0;
      const label = item.purchased ? "已购买" : maxed ? "相关属性已满"
        : unaffordable ? `资金不足 · ${money(item.cost)}` : `购买 · ${money(item.cost)}`;
      return `<article class="shop-card"><div class="shop-icon" data-icon>${icon(item.icon)}</div>
        <h3>${item.title}</h3><p>${item.description}</p><div class="boosts">${boostsMarkup(boosts)}</div>
        ${button(label, "buy", { id: item.id, disabled: item.purchased || unaffordable || maxed })}</article>`;
    }).join("");
    const results = state.weekResults.at(-1);
    const supportIncome = results?.supportRevenue ? `，其中月度支持回款 ${money(results.supportRevenue)}` : "";
    const monthlySettlement = results?.payroll || results?.operatingCost
      ? `<p class="monthly-settlement"><b>本月已扣款</b><span>工资 ${money(-results.payroll)}</span>
        <span>运营费 ${money(-results.operatingCost)}</span></p>` : "";
    const refreshCost = game.getOpportunityRefreshCost(state);
    const canRefresh = game.canRefreshOpportunities(state);
    const refreshLabel = refreshCost === 0 ? "免费刷新"
      : canRefresh ? `刷新 · ${money(refreshCost)}` : `资金不足 · ${money(refreshCost)}`;
    const toolbar = `<div class="shop-toolbar"><div class="shop-balance" data-negative="${state.cash < 0}">${state.cash < 0 ? "资金缺口" : "可用资金"} ${money(state.cash)}
      <small>每周首次免费，之后每次 ${money(game.opportunityRefreshCost)}</small>
      <small>刷新换出 3 张新卡，已购买的升级会保留</small></div>
      ${button(`${icon("rotate")} ${refreshLabel}`, "refresh-shop", { disabled: !canRefresh })}</div>`;
    show("shop", `第 ${weekNumber(state.week)} 周结束  /  WEEKEND`, "周末机遇商店",
      `本周签约成功 ${results?.won ?? 0} 单，错过 ${results?.expired ?? 0} 位客户，收入 ${money(results?.revenue ?? 0)}${supportIncome}。`,
      `${monthlySettlement}${toolbar}<div class="shop-grid">${cards}</div>`,
      `<span class="push">机遇可选购，每张限购一次</span>${button(
        state.week === game.weeksPerYear ? `查看年终总结 ${icon("arrow")}` : `进入第 ${weekNumber(state.week + 1)} 周 ${icon("arrow")}`,
        "next", { accent: true })}`);
  }

  function showSummary() {
    if (state?.phase !== "summary") return;
    const result = game.summarize(state);
    const rate = result.signed ? Math.round(result.won / result.signed * 100) : 0;
    const body = `<div class="summary-figures">
      ${figure("期末资金", money(result.finalCash))}${figure("全年收入", money(result.revenue))}
      ${figure("全年支出", money(result.spent))}${figure("项目收入", money(result.projectRevenue))}
      ${figure("支持合同回款", money(result.supportRevenue))}${figure("全年工资", money(result.payroll))}
      ${figure("全年运营费", money(result.operatingCost))}${figure("商店刷新支出", money(result.refreshSpent))}
      ${figure("年度资金净变动", money(result.net))}${figure("签约成功 / 尝试", `${result.won} / ${result.signed}`)}
      ${figure("实际签约成功率", `${rate}%`)}
      </div><div class="summary-stats boosts">${Object.entries(state.stats).map(([key, value]) => `<span>${game.statLabels[key]} ${value}</span>`).join("")}</div>`;
    show("summary", "年度结算  /  YEAR 01", "创业第一年，收官！",
      `${roleData().name}经营了 52 周，拿下 ${result.won} 份合同，投资了 ${state.opportunityPurchases.length} 次周末机遇。`,
      body, `${button("经营记录", "history")}${button("开启新档", "reset", { accent: true })}`);
  }

  function showHistory() {
    const entries = [
      ...(state?.history || []).map((entry) => ({
        week: entry.week, title: entry.title, detail: entry.client,
        result: entry.status !== "won" ? "签约失败"
          : entry.kind === "support" ? `签约 · ${money(entry.amount)}/月` : `+${money(entry.amount)}`
      })),
      ...(state?.eventHistory || []).map((entry) => ({
        week: entry.week, title: entry.title, detail: `突发事件 · ${entry.label}`,
        result: eventEffects(entry) || "已处理"
      })),
      ...(state?.supportPayments || []).map((entry) => ({
        week: entry.week, title: entry.title, detail: `${entry.client} · 月度支持回款`, result: `+${money(entry.amount)}`
      })),
      ...(state?.weekResults || []).flatMap((entry) => [
        ["发放工资", entry.payroll], ["运营费", entry.operatingCost]
      ].filter(([, amount]) => amount > 0).map(([title, amount]) => ({
        week: entry.week, title, detail: "月度固定支出", result: money(-amount)
      }))),
      ...(state?.opportunityPurchases || []).map((entry) => ({
        week: entry.week, title: entry.title, detail: "周末机遇", result: `−${money(entry.cost)}`
      })),
      ...(state?.opportunityRefreshes || []).map((entry) => ({
        week: entry.week, title: "刷新机遇商店", detail: "周末机遇", result: entry.cost === 0 ? "免费" : `−${money(entry.cost)}`
      }))
    ].reverse().sort((a, b) => b.week - a.week);
    show("history", "经营档案  /  LOGBOOK", "经营记录", "回顾签约、回款、突发事件和经营支出。",
      entries.length ? `<ul class="history-list">${entries.map((entry) => `<li>
        <div><b>${entry.title}</b><br><small>第 ${weekNumber(entry.week)} 周 · ${entry.detail}</small></div><strong>${entry.result}</strong></li>`).join("")}</ul>`
        : '<p class="empty-records">接待客户、处理事件或购买机遇后，这里会留下记录。</p>',
      button("关闭", "close", { accent: true }));
  }

  function showHelp() {
    show("help", "经营手册  /  HOW TO PLAY", "公司怎么经营？", "",
      `<ol class="help-list"><li>选择创始人，带着 ${money(game.startCash)} 启动资金开业。</li>
      <li>每周有 ${game.weekSeconds} 秒营业时间。客户陆续经过街区，离开后本周就错过了这份合同。点击客户可查看金额、成功率和离开倒计时。</li>
      <li>项目签约后即时到账。标记「月付」的支持合同通常更难签，从签约周之后的首个月末开始按月回款。</li>
      <li>月末自动扣除工资 ${money(game.monthlyPayroll)} 和运营费 ${money(game.monthlyOperatingCost)}。资金不足时余额会变为负数，后续收入可填补缺口。</li>
      <li>营业中可能遇到接口故障、上线变更或演示插曲。限时决定会影响资金、公司属性或当周签约率，超时会自动结算。</li>
      <li>周末可安排技术演练、客户交流等活动来升级公司属性。每周首次刷新机遇免费，之后每次 ${money(game.opportunityRefreshCost)}。准备好后手动进入下一周。</li>
      <li>经营满 ${game.weeksPerYear} 周后，查看收入、支出、签约和公司属性的年度总结。</li>
      <li>进度保存在本机。营业倒计时会持续计时，周末商店可随时回来继续。</li></ol>`,
      button("开始经营", "close", { accent: true }));
  }

  function checkDeadline(now = Date.now()) {
    const next = state && game.tick(events.tick(state, now), now);
    const changed = next !== state;
    if (changed) {
      const weekEnded = next.phase === "opportunities" && state.phase === "week";
      commit(next);
      if (weekEnded) {
        showShop();
        return;
      }
    }
    if (dialog.open && dialog.dataset.awaiting === "true") {
      const id = dialog.dataset.contractId;
      const contract = state.contracts.find((item) => item.id === id);
      if (contract && (changed || !game.isContractAvailable(state, contract, now))) showContract(id, now);
    }
    renderTraffic(now);
    renderEvents(now);
    renderClock(now);
  }

  document.addEventListener("click", (event) => {
    const control = event.target.closest("button[data-action]");
    if (!control || control.disabled) return;
    const { action, id } = control.dataset;
    const now = Date.now();
    switch (action) {
      case "role":
        selectedRole = id;
        renderBoard();
        showRoles(id);
        break;
      case "start":
        commit(game.createGame(selectedRole, now));
        dialog.close();
        toast("O一下 信息科技有限公司开业了！");
        break;
      case "contract":
        checkDeadline(now);
        if (state?.phase === "week") showContract(id, now);
        break;
      case "sign": {
        checkDeadline(now);
        if (state?.phase !== "week") break;
        const next = game.signContract(state, id, now);
        if (next !== state) commit(next);
        showContract(id, now);
        break;
      }
      case "event-choice": {
        checkDeadline(now);
        if (state?.phase !== "week") break;
        const next = events.choose(state, id, control.dataset.choice, now);
        if (next !== state) commit(next);
        break;
      }
      case "buy": {
        const next = game.buyOpportunity(state, id);
        if (next !== state) commit(next);
        showShop();
        if (next.opportunities.find((item) => item.id === id)?.purchased) {
          dialogContent.querySelector('[data-action="next"]')?.focus();
        }
        break;
      }
      case "refresh-shop": {
        const next = game.refreshOpportunities(state);
        if (next === state) break;
        commit(next);
        showShop();
        dialogContent.querySelector(game.canRefreshOpportunities(state) ? '[data-action="refresh-shop"]' : '[data-action="next"]')?.focus();
        break;
      }
      case "next": {
        const next = game.nextWeek(state, now);
        if (next === state) break;
        commit(next);
        if (state.phase === "summary") showSummary();
        else {
          dialog.close();
          toast(`第 ${state.week} 周开始，客户已经到了。`);
        }
        break;
      }
      case "shop": showShop(); break;
      case "summary": showSummary(); break;
      case "history": showHistory(); break;
      case "help": showHelp(); break;
      case "reset":
        show("reset", "重新经营  /  NEW GAME", "开启新的第一年？",
          "确认后，当前本地存档会被清除。你可以重新选择创始人。", "",
          `${button("返回", "close")}${button("清除存档并重开", "confirm-reset", { accent: true })}`);
        break;
      case "confirm-reset":
        selectedRole = game.roles[0].id;
        commit(null);
        showRoles();
        break;
      case "close": dialog.close(); break;
    }
  });

  dialog.addEventListener("cancel", (event) => {
    if (dialog.dataset.view === "roles") event.preventDefault();
  });
  document.addEventListener("visibilitychange", () => checkDeadline());
  window.addEventListener("pageshow", () => checkDeadline());
  document.querySelectorAll("[data-icon]").forEach((element) => {
    element.innerHTML = icon(element.dataset.icon);
  });

  if (state) {
    const now = Date.now();
    commit(game.tick(events.tick(state, now), now));
    if (state.phase === "opportunities") showShop();
    if (state.phase === "summary") showSummary();
  } else {
    renderBoard();
    showRoles();
  }
  setInterval(checkDeadline, 150);
  requestAnimationFrame(animateWalkers);
})();

</script>
</body>
</html>
